# Example server block for an existing nginx with Let's Encrypt (certbot).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;

    # no access log, so no ip addresses are stored
    access_log off;

    # one request never holds more than a full vault (5 MB by default)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8463;
        proxy_set_header Host $host;
        # overwrite, do not append, so clients cannot fake it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;
    return 301 https://$host$request_uri;
}
